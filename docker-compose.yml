# Self-hosted graph database for the Chat → KG platform.
#
# Graphiti (core engine) requires Neo4j >= 5.26. Community edition is enough:
# every KG version is stored as a full copy under its own Graphiti group_id
# (e.g. kg_<kg_id>__v<n>, kg_<kg_id>__draft) inside the single `neo4j` database,
# so we don't need Enterprise multi-database support.
#
# Usage:
#   cp .env.example .env   # then set NEO4J_PASSWORD
#   docker compose up -d neo4j
#   open http://localhost:7474  (Neo4j Browser)

name: chat-kg

services:
  neo4j:
    image: neo4j:5.26.2-community
    container_name: chat-kg-neo4j
    restart: unless-stopped
    ports:
      # Bound to localhost only; put a reverse proxy / VPN in front for remote access.
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # Memory: whole-copy versioning multiplies node/edge count by the number of
      # retained versions, so size page cache for (graph size x versions kept).
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
      # Copy-on-commit duplicates a whole version in one transaction.
      NEO4J_db_transaction_timeout: ${NEO4J_TX_TIMEOUT:-300s}
      NEO4J_server_default__listen__address: 0.0.0.0
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./infra/neo4j/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

volumes:
  neo4j_data:
  neo4j_logs:
