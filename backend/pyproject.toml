[project]
name = "chatkg-backend"
version = "0.1.0"
description = "Chat export -> Graphiti knowledge graph (Groq generation, CPU embeddings, Neo4j)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "graphiti-core[groq,gliner2,sentence-transformers]==0.31.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "torch>=2.4",
    "tzdata; sys_platform == 'win32'",
    "uvicorn>=0.32",
]

[project.scripts]
chatkg = "app.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# CPU-only torch wheels (~200 MB instead of multi-GB CUDA builds).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["models: downloads and runs the CPU models (slow)", "neo4j: needs the Neo4j from docker-compose (skipped when unreachable)"]
addopts = "-m 'not models'"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
